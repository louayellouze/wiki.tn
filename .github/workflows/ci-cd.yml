name: CI/CD — Wiki.tn

on:
  push:
    branches: [release]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND:    ghcr.io/louayellouze/wiki-backend
  IMAGE_FRONTOFFICE: ghcr.io/louayellouze/wiki-frontoffice
  IMAGE_BACKOFFICE:  ghcr.io/louayellouze/wiki-backoffice

