sonar.projectKey=louayellouze_wiki-tn
sonar.organization=louayellouze
sonar.projectName=Wiki.tn
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# ─── Backend Java ─────────────────────────────────────────────────────────────
sonar.sources=backend/src/main/java
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# ─── Frontends TypeScript ──────────────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=frontoffice/coverage/lcov.info,backoffice/coverage/lcov.info

# ─── Exclusions ───────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/target/**,\
  **/.next/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/public/**
