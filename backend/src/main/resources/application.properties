# --- Monitoring des requêtes lentes (Slow Query Monitoring) ---
# Active les statistiques Hibernate pour voir les temps d'exécution globaux
spring.jpa.properties.hibernate.generate_statistics=true
# Log les requêtes qui prennent plus de 500ms (ajustez selon vos besoins)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=500
# Affiche le temps exact de chaque requête dans les logs
logging.level.org.hibernate.stat=DEBUG
# Affiche les statistique Hibernate (temps, nombre de requêtes) sans le texte SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
