services:

  # ─── Reverse Proxy ────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: wiki-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontoffice
      - backoffice
    networks:
      - wiki-network

  # ─── SSL Auto-renouvellement (Let's Encrypt) ──────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: wiki-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - wiki-network

  # ─── Base de données ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wikidb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wikidb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Spring Boot ──────────────────────────────────────────────────────
  backend:
    image: ghcr.io/louayellouze/wiki-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wiki-backend
    restart: unless-stopped
    environment:
      - APP_CORS_ALLOWED_ORIGINS=https://staging.wiki.tn,https://dashboard.wiki.tn
      - APP_FRONTEND_URL=https://staging.wiki.tn
      - DB_PASSWORD=${DB_PASSWORD:-admin}
    env_file:
      - ./backend.env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wiki-network

  # ─── Front Office (Next.js 14) ────────────────────────────────────────────────
  frontoffice:
    image: ghcr.io/louayellouze/wiki-frontoffice:latest
    build:
      context: ./frontoffice
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://staging.wiki.tn/api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: wiki-frontoffice
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - wiki-network

  # ─── Back Office (Next.js) ────────────────────────────────────────────────────
  backoffice:
    image: ghcr.io/louayellouze/wiki-backoffice:latest
    build:
      context: ./backoffice
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://staging.wiki.tn/api
    container_name: wiki-backoffice
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - wiki-network

# ─── Volumes persistants ──────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:

# ─── Réseau interne ───────────────────────────────────────────────────────────
networks:
  wiki-network:
    driver: bridge
