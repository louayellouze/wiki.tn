events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # ── DNS Docker interne — re-résolution dynamique des upstreams ────────────
    # Évite le cache d'IP au démarrage qui provoque l'inversion des domaines
    # quand les containers redémarrent et obtiennent de nouvelles IPs
    resolver 127.0.0.11 valid=15s ipv6=off;
    resolver_timeout 5s;

    # Proxy headers communs
    proxy_http_version 1.1;
    proxy_set_header Upgrade        $http_upgrade;
    proxy_set_header Connection     'upgrade';
    proxy_set_header Host           $host;
    proxy_set_header X-Real-IP      $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;

    # CORS global — garantit les headers même si le backend renvoie 502
    map $http_origin $cors_origin {
        "https://staging.wiki.tn"   "https://staging.wiki.tn";
        "https://dashboard.wiki.tn" "https://dashboard.wiki.tn";
        default                     "";
    }

    # ─── HTTP : redirect HTTPS + ACME challenge certbot ───────────────────────
    server {
        listen 80;
        server_name staging.wiki.tn dashboard.wiki.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── staging.wiki.tn — Frontoffice + Backend API ──────────────────────────
    server {
        listen 443 ssl;
        server_name staging.wiki.tn;

        ssl_certificate     /etc/letsencrypt/live/staging.wiki.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.wiki.tn/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # Backend REST API
        set $backend_upstream "backend";

        # Preflight CORS — répondu directement par nginx (évite le 502 sans headers)
        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' '86400' always;
                add_header 'Content-Length' '0';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://$backend_upstream:8089;
        }

        # Fichiers uploadés
        location /uploads/ {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            proxy_pass http://$backend_upstream:8089;
        }

        # Frontoffice Next.js — variable force la re-résolution DNS
        set $frontoffice_upstream "frontoffice";
        location / {
            proxy_pass http://$frontoffice_upstream:3000;
        }
    }

    # ─── dashboard.wiki.tn — Backoffice Admin ─────────────────────────────────
    server {
        listen 443 ssl;
        server_name dashboard.wiki.tn;

        ssl_certificate     /etc/letsencrypt/live/staging.wiki.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.wiki.tn/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # Backoffice — variable force la re-résolution DNS
        set $backoffice_upstream "backoffice";
        location / {
            proxy_pass http://$backoffice_upstream:3000;
        }
    }
}
