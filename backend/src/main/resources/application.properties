spring.application.name=wiki
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
app.google.client-id=${GOOGLE_CLIENT_ID:767179905177-detn60tjgq0kln9vs25c1jkml3l46h7b.apps.googleusercontent.com}

server.port=${SERVER_PORT:8089}
server.address=0.0.0.0
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wikidb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# --- Monitoring des requêtes lentes ---
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=500
logging.level.org.hibernate.stat=DEBUG
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# -----------------------------------------------------------
# Optimisations des performances
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
# -----------------------------------------------------------

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:86400000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Configuration du serveur de mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# OpenAI / OpenRouter Configuration
openai.api.key=${OPENAI_API_KEY}
openai.api.url=${OPENAI_API_URL:https://openrouter.ai/api/v1/chat/completions}
spring.jackson.mapper.default-view-inclusion=true

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
# Devise Stripe — tnd non supporté sur comptes test, utiliser eur ou usd
stripe.currency=${STRIPE_CURRENCY:eur}

# Fichiers uploadés
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
