spring.application.name=wiki
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
app.google.client-id=${GOOGLE_CLIENT_ID:767179905177-detn60tjgq0kln9vs25c1jkml3l46h7b.apps.googleusercontent.com}

server.port=${SERVER_PORT:8089}
server.address=0.0.0.0
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wikidb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# --- Performances JPA ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.stat=WARN
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
# --- HikariCP Connection Pool ---
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
# -----------------------------------------------------------

jwt.secret=${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:86400000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Configuration du serveur de mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# OpenAI / OpenRouter Configuration
openai.api.key=${OPENAI_API_KEY:your-openai-api-key}
openai.api.url=${OPENAI_API_URL:https://openrouter.ai/api/v1/chat/completions}
spring.jackson.mapper.default-view-inclusion=true

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:your-stripe-api-key}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:your-stripe-webhook-secret}
# Devise Stripe — tnd non supporté sur comptes test, utiliser eur ou usd
stripe.currency=${STRIPE_CURRENCY:eur}

# Fichiers uploadés
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
